:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:700}
header .sub{color:var(--muted);font-size:11px}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);font-size:11px;cursor:pointer;user-select:none}
.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(245,185,66,.08)}
#zoomctl{margin-left:auto;display:flex;gap:6px}
#zoomctl button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12px}
#main{flex:1;display:flex;min-height:0}
#canvas{flex:1;position:relative;overflow:hidden;cursor:grab}
#canvas.dragging{cursor:grabbing}
svg{position:absolute;top:0;left:0}
#sidebar{width:340px;border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:16px;flex-shrink:0}
#sidebar h2{font-size:13.5px;margin-bottom:2px}
#sidebar .path{font:10.5px ui-monospace,Menlo,monospace;color:var(--accent);word-break:break-all;margin-bottom:8px}
#sidebar .role{font-size:12px;margin-bottom:8px}
#sidebar .plain{font-size:12px;color:#c9d4c9;background:var(--panel-2);border-left:3px solid var(--route);padding:8px 10px;border-radius:0 8px 8px 0;margin-bottom:10px}
#sidebar .sec{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;font-weight:700}
#sidebar ul{list-style:none}
#sidebar li{font-size:11.5px;color:#bdbdbd;padding:3px 0;border-bottom:1px solid #222}
#sidebar li b{color:var(--text)}
.fixitem{color:#9be29b!important}
.bugitem-high{color:#ff8f9d!important}
.bugitem-med{color:#ffd28a!important}
.bugitem-low{color:#9ad1ff!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.legend span{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.node{cursor:pointer}
.node rect{transition:opacity .15s}
.node text{pointer-events:none}
.dim{opacity:.13}
.edge{transition:opacity .15s}
.edgelabel{font-size:8.5px;fill:var(--muted)}
.clusterlabel{font-size:12px;font-weight:700;letter-spacing:1.5px}
</style>
</head>

function edgePath(e){
  const a = nodeById[e.from], b = nodeById[e.to];
  const x1 = a.x + a.w, y1 = a.y + a.h/2;
  const x2 = b.x, y2 = b.y + b.h/2;
  if (x2 > x1) {
    const mx = (x1 + x2)/2;
    return {d:`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`, lx:(x1+x2)/2, ly:(y1+y2)/2 - 6};
  }
  // backward edge: route under
  const x1b = a.x, x2b = b.x + b.w;
  const mx = (x1b + x2b)/2;
  return {d:`M ${x1b} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2b} ${y2}`, lx:mx, ly:(y1+y2)/2 - 6};
}

function visibleForChip(item){
  if (activeChip === 'bugs') return true;
  if (activeChip === 'critical') return !!item.critical || item.kind === 'critical';
  return (item.tag || []).includes(activeChip);
}

function renderSafe(){
  let g = `<g id="world">`;
  for (const c of clusters){
    const col = getComputedStyle(document.documentElement).getPropertyValue(CLUSTER_COLOR[c.id].slice(4,-1)).trim();
    g += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="14" fill="${col}0d" stroke="${col}33"/>`;
    g += `<text class="clusterlabel" x="${c.x+14}" y="${c.y+28}" fill="${col}">${c.label}</text>`;
  }
  for (const e of edges){
    const vis = visibleForChip(e) && (activeChip !== 'bugs');
    const conn = selected && (e.from === selected || e.to === selected);
    const dim = (!vis && !conn) || (selected && !conn);
    const p = edgePath(e);
    const col = EDGE_COLOR[e.kind] || '#555';
    g += `<g class="edge ${dim?'dim':''}"><path d="${p.d}" fill="none" stroke="${col}" stroke-width="${e.kind==='critical'?2.2:1.3}" marker-end="url(#arr-${e.kind})" opacity="${e.kind==='normal'?0.55:0.85}"/><text class="edgelabel" x="${p.lx}" y="${p.ly}" text-anchor="middle">${e.label}</text></g>`;
  }
  for (const n of nodes){
    const fixes = FIXES[n.id] || [], bugs = KNOWN_BUGS[n.id] || [];
    let vis = visibleForChip(n);
    if (activeChip === 'bugs') vis = fixes.length || bugs.length;
    const conn = selected && (n.id === selected || edges.some(e => (e.from === selected && e.to === n.id) || (e.to === selected && e.from === n.id)));
    const dim = (!vis && !conn) || (selected && !conn);
    const stroke = getComputedStyle(document.documentElement).getPropertyValue(NODE_STROKE[n.color].slice(4,-1)).trim();
    g += `<g class="node ${dim?'dim':''}" data-id="${n.id}">`;
    g += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="var(--panel-2)" stroke="${stroke}" stroke-width="${n.critical?2.2:1.2}"/>`;
    g += `<text x="${n.x+12}" y="${n.y+22}" fill="var(--text)" font-size="12.5" font-weight="700">${esc(n.label)}</text>`;
    g += `<text x="${n.x+12}" y="${n.y+38}" fill="var(--muted)" font-size="10">${esc(n.sub)}</text>`;
    let bx = n.x + n.w - 14;
    if (fixes.length){ g += `<circle cx="${bx}" cy="${n.y+14}" r="9" fill="#1f4d2b" stroke="#30d158"/><text x="${bx}" y="${n.y+17.5}" text-anchor="middle" font-size="9.5" fill="#9be29b" font-weight="700">${fixes.length}</text>`; bx -= 22; }
    if (bugs.length){ g += `<circle cx="${bx}" cy="${n.y+14}" r="9" fill="#4d1f27" stroke="#ff3860"/><text x="${bx}" y="${n.y+17.5}" text-anchor="middle" font-size="9.5" fill="#ff8f9d" font-weight="700">${bugs.length}</text>`; }
    g += `</g>`;
  }
  g += `</g>`;
  const defs = svg.querySelector('defs') ? svg.querySelector('defs').outerHTML : '';
  svg.innerHTML = defs + g;
  applyTransform();
  bindNodes();
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function bindNodes(){
  svg.querySelectorAll('.node').forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); selected = el.dataset.id; renderSafe(); showNode(selected); });
    el.addEventListener('mouseenter', () => { if (!selected) showNode(el.dataset.id); });
    el.addEventListener('mouseleave', () => { if (!selected) showDefault(); });
  });
}

function showNode(id){
  const n = nodeById[id];
  const fixes = FIXES[id] || [], bugs = KNOWN_BUGS[id] || [];
  const inc = edges.filter(e => e.to === id), out = edges.filter(e => e.from === id);
  sidebar.innerHTML = `
    <h2>${esc(n.label)} ${n.critical ? '<span style="color:var(--critical);font-size:10px">● CRITICAL PATH</span>' : ''}</h2>
    <div class="path">${esc(n.path || '')}</div>
    <div class="role">${esc(n.role || '')}</div>
    <div class="plain">${esc(n.plain || '')}</div>
    ${n.notes ? `<div class="sec">Notes</div><ul>${n.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${bugs.length ? `<div class="sec">Known bugs</div><ul>${bugs.map(b=>`<li class="bugitem-${b.sev}"><b>[${b.sev.toUpperCase()}]</b> ${esc(b.t)}${b.ref?` <span style="color:var(--muted)">(${esc(b.ref)})</span>`:''}</li>`).join('')}</ul>` : ''}
    ${fixes.length ? `<div class="sec">Roadmap fixes</div><ul>${fixes.map(f=>`<li class="fixitem"><b>#${f.n}</b> ${esc(f.t)}</li>`).join('')}</ul>` : ''}
    <div class="sec">Incoming (${inc.length})</div><ul>${inc.map(e=>`<li><b>${esc(nodeById[e.from].label)}</b> — ${esc(e.label)}</li>`).join('') || '<li>none</li>'}</ul>
    <div class="sec">Outgoing (${out.length})</div><ul>${out.map(e=>`<li><b>${esc(nodeById[e.to].label)}</b> — ${esc(e.label)}</li>`).join('') || '<li>none</li>'}</ul>`;
}

function showDefault(){
  const bugCount = Object.values(KNOWN_BUGS).flat().length;
  const fixCount = new Set(Object.values(FIXES).flat().map(f=>f.n)).size;
  sidebar.innerHTML = `
    <h2>Vantus — the map at a glance</h2>
    <div class="role">Multi-tenant agency fulfillment OS. ${nodes.length} nodes · ${edges.length} wires · 6 clusters. Hover or click any node.</div>
    <div class="plain">Vantus runs Cloud Scenic's client delivery end to end: content pipeline with real approval receipts, AI agents with paper trails, billing, and the truth layer that proves what was approved and what actually published.</div>
    <div class="sec">Notable findings from this map</div>
    <ul>
      <li class="bugitem-high"><b>All AI is down right now:</b> the Anthropic account's credit balance is $0 (observed 8/21). One top-up un-gates QC, Muse, Scrappy, Intel, Sentinel and AI Assign at once.</li>
      <li class="bugitem-med"><b>Email is ARMED:</b> proven live 8/21 — approval links and reports really deliver now. There is no dry-run net anymore.</li>
      <li class="bugitem-med"><b>Stripe is installed but unproven:</b> keys sit in prod since ~July, never validated; the invoice create-path has never made a real invoice.</li>
      <li class="bugitem-med"><b>Drive upload never worked in prod:</b> Google was never told usevantus.com is an allowed origin (one console field).</li>
      <li><b>Dead/parked code located:</b> ShipWorld3D + 4 renderer modules unmounted (deliberate), plus "ripped out features/" and "(experimental)/" archive folders.</li>
      <li><b>Hot path:</b> everything rides App.jsx (1,622 lines, all app state, no tests) and the agent-action dispatcher — the two files to be most careful in.</li>
      <li><b>Two mirrored writers:</b> approvals logic exists twice on purpose (browser recordApproval + server executeDecision) — they must change together.</li>
      <li><b>Inert-by-design:</b> verify-publishes' auto-verify join is built but has no platform_post_id writer until Sprout wiring (Phase C).</li>
    </ul>
    <div class="sec">Open items</div>
    <ul><li>${bugCount} known bugs · ${fixCount} numbered fixes — see the <b>Bugs &amp; Roadmap</b> chip and docs/architecture-map/open-items.md</li></ul>
    <div class="sec">Legend</div>
    <div class="legend">
      <span><i style="background:var(--critical)"></i>critical seam</span>
      <span><i style="background:var(--accent-2)"></i>external API</span>
      <span><i style="background:var(--db)"></i>DB read/write</span>
      <span><i style="background:var(--client)"></i>mount</span>
      <span><i style="background:#555"></i>call</span>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><i style="background:#30d158;height:9px;width:9px;border-radius:50%"></i>fix count</span>
      <span><i style="background:#ff3860;height:9px;width:9px;border-radius:50%"></i>bug count</span>
    </div>`;
}

/* chips */
const chipsEl = document.getElementById('chips');
chipsEl.innerHTML = chipsDef.map(c=>`<div class="chip ${c.id===activeChip?'active':''}" data-id="${c.id}">${c.label}</div>`).join('');
chipsEl.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => {
  activeChip = el.dataset.id; selected = null;
  chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x.dataset.id===activeChip));
  renderSafe(); showDefault();
}));

/* pan + zoom */
let tx = 0, ty = 0, s = 1;
function applyTransform(){ const w = svg.querySelector('#world'); if (w) w.setAttribute('transform', `translate(${tx},${ty}) scale(${s})`); }
function fit(){
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  s = Math.min(cw / W, ch / H) * 0.96;
  tx = (cw - W*s)/2; ty = 12;
  applyTransform();
}
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.classList.add('dragging'); });
window.addEventListener('mousemove', e => { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; applyTransform(); });
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  tx = mx - (mx - tx) * f; ty = my - (my - ty) * f; s *= f;
  applyTransform();
}, { passive:false });
canvas.addEventListener('click', () => { selected = null; renderSafe(); showDefault(); });
document.getElementById('zfit').addEventListener('click', fit);
document.getElementById('zin').addEventListener('click', () => { s *= 1.2; applyTransform(); });
document.getElementById('zout').addEventListener('click', () => { s /= 1.2; applyTransform(); });

renderSafe(); fit(); showDefault();
</script>
</body>
