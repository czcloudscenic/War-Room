[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/agent-action"
  to = "/.netlify/functions/agent-action"
  status = 200

[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

# Public client intake — token-gated unauthenticated POST into intake_requests.
[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200
  force = true

# Vanity path for the intake form (no SPA catch-all exists, so /intake would 404).
[[redirects]]
  from = "/intake"
  to = "/intake.html"
  status = 200

# Approval decisions — portal POSTs (session) + one-click email links (token).
# GET renders the confirm page; POST executes. force=true so the GET link never
# falls through to the SPA.
[[redirects]]
  from = "/api/approval"
  to = "/.netlify/functions/approval-decision"
  status = 200
  force = true

# Stripe — app creates hosted invoices; Stripe posts payment webhooks. Same fn.
[[redirects]]
  from = "/api/billing/stripe"
  to = "/.netlify/functions/billing-stripe"
  status = 200

[[redirects]]
  from = "/api/billing/stripe-webhook"
  to = "/.netlify/functions/billing-stripe"
  status = 200

[[redirects]]
  from = "/api/apify-scrape"
  to = "/.netlify/functions/apify-scrape"
  status = 200

[[redirects]]
  from = "/api/unsplash"
  to = "/.netlify/functions/unsplash"
  status = 200

[[redirects]]
  from = "/api/dynasty"
  to = "/.netlify/functions/dynasty"
  status = 200

[[redirects]]
  from = "/api/oauth/data-deletion-status"
  to = "/.netlify/functions/oauth-data-deletion-status"
  status = 200

# Instagram OAuth flow (Meta's Instagram Business Login)
[[redirects]]
  from = "/api/oauth/instagram/start"
  to = "/.netlify/functions/oauth-instagram-start"
  status = 200

[[redirects]]
  from = "/api/oauth/instagram/callback"
  to = "/.netlify/functions/oauth-instagram-callback"
  status = 200

[[redirects]]
  from = "/api/oauth/instagram/deauthorize"
  to = "/.netlify/functions/oauth-instagram-deauthorize"
  status = 200

[[redirects]]
  from = "/api/oauth/instagram/data-deletion"
  to = "/.netlify/functions/oauth-instagram-data-deletion"
  status = 200

[[redirects]]
  from = "/api/sync/instagram"
  to = "/.netlify/functions/sync-instagram"
  status = 200

# TikTok OAuth flow
[[redirects]]
  from = "/api/oauth/tiktok/start"
  to = "/.netlify/functions/oauth-tiktok-start"
  status = 200

[[redirects]]
  from = "/api/oauth/tiktok/callback"
  to = "/.netlify/functions/oauth-tiktok-callback"
  status = 200

[[redirects]]
  from = "/api/oauth/tiktok/deauthorize"
  to = "/.netlify/functions/oauth-tiktok-deauthorize"
  status = 200

[[redirects]]
  from = "/api/oauth/tiktok/data-deletion"
  to = "/.netlify/functions/oauth-tiktok-data-deletion"
  status = 200

[[redirects]]
  from = "/api/sync/tiktok"
  to = "/.netlify/functions/sync-tiktok"
  status = 200

# YouTube OAuth flow (Google OAuth + YouTube Data API)
[[redirects]]
  from = "/api/oauth/youtube/start"
  to = "/.netlify/functions/oauth-youtube-start"
  status = 200

[[redirects]]
  from = "/api/oauth/youtube/callback"
  to = "/.netlify/functions/oauth-youtube-callback"
  status = 200

[[redirects]]
  from = "/api/oauth/youtube/deauthorize"
  to = "/.netlify/functions/oauth-youtube-deauthorize"
  status = 200

[[redirects]]
  from = "/api/oauth/youtube/data-deletion"
  to = "/.netlify/functions/oauth-youtube-data-deletion"
  status = 200

[[redirects]]
  from = "/api/sync/youtube"
  to = "/.netlify/functions/sync-youtube"
  status = 200

[functions]
  external_node_modules = ["node-fetch"]

[functions."agent-action"]
  timeout = 26

# Daily "chase" — nudges assignees + Danny about overdue tasks. 14:00 UTC (~7am PT).
[functions."chase-overdue-tasks"]
  schedule = "0 14 * * *"
  timeout = 26

# Daily monthly-report pass — sends any ready client report (from the 1st) and
# nags from the 28th if the month's Sprout PDF hasn't been dropped in yet.
[functions."send-monthly-reports"]
  schedule = "0 13 * * *"
  timeout = 26

# Daily stuck-item bottleneck check — flags items sitting past their per-status
# threshold, creates/completes "Unstick" tasks, re-sends client approval links.
# 16:00 UTC (~9am PT), an hour after the runway check.
[functions."check-stuck-items"]
  schedule = "0 16 * * *"
  timeout = 26

# Daily content-runway check — measures every tracked client's scheduled queue
# (Sprout) + pipeline inventory, alerts #content + email, auto-creates/completes
# "Book shoot" tasks. Monday run adds the all-clients digest. 15:00 UTC (~8am PT).
# esbuild so it can require the shared ESM math module (src/utils/runway.mjs).
[functions."content-runway-check"]
  schedule = "0 15 * * *"
  timeout = 26
  node_bundler = "esbuild"

# Daily publish-verification sweep (Phase B truth) — flags past-due items with
# no publish receipt, auto-verifies items whose platform_post_id matches the
# account_posts mirror. 16:30 UTC, after check-stuck-items.
[functions."verify-publishes"]
  schedule = "30 16 * * *"
  timeout = 26

# Nightly encrypted export of the operational core to the private `backups`
# bucket + backup_runs ledger row (Phase B backup discipline). Requires
# BACKUP_ENC_KEY (32-byte base64) in Netlify env — logs a FAILED run without it.
[functions."backup-export"]
  schedule = "0 11 * * *"
  timeout = 26

# Nightly Content Intel refresh — recomputes content_analysis rates from
# account_posts for every client with a connected IG account. Deterministic
# only, no AI spend. 15:30 UTC (~8:30am PT), after content-runway-check.
[functions."intel-refresh"]
  schedule = "30 15 * * *"
  timeout = 26

[functions."apify-scrape"]
  timeout = 26

[functions."sync-instagram"]
  timeout = 26

[functions."sync-tiktok"]
  timeout = 26

[functions."sync-youtube"]
  timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    # Existing
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # Added 2026-05-26 security sweep
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP — locked down to the actual origins this app talks to.
    # If a new external service is added (e.g. another Anthropic-style API), update
    # connect-src here. style-src has NO 'unsafe-inline' (2026-07-12): React
    # style={{}} props set styles via CSSOM and are not governed by style-src;
    # the one runtime <style> injection (LoginScreen) was moved into globals.css.
    # If a future dependency injects <style> tags it will surface as a console
    # CSP violation — prefer bundled CSS over re-adding 'unsafe-inline'.
    # The first sha256 hash allowlists the <style> tag Google Identity Services
    # (index.html gsi/client, used by the Drive-upload token client) injects for
    # its in-page button — a button this app never renders, so if Google rotates
    # that CSS the only regression is a harmless console violation returning.
    # The second hash (added 2026-08-14) allowlists the one <style> injection
    # from the app bundle itself (React 19 style-hoisting internals, surfaced
    # as a console violation since the Phase B deploy). Same deal: if the
    # content rotates, the only regression is the console line returning.
    # img-src includes data:/blob: for inline previews and the Supabase storage host.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' https://fonts.googleapis.com 'sha256-CJ02OVqT7p9v9HDCMKiouj0TJ0ooW7ybXUHymIEqyeE=' 'sha256-lQZQ4C7UCUXDz7K+ccFfL2rD8AwBREmaKZQjonJIKEI='; img-src 'self' data: blob: https://wjcstqqihtebkpyuacop.supabase.co https://images.unsplash.com https://*.cdninstagram.com https://*.fbcdn.net https://*.tiktokcdn.com https://*.tiktokcdn-us.com https://*.ytimg.com https://*.googleusercontent.com; media-src 'self' https://wjcstqqihtebkpyuacop.supabase.co; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://wjcstqqihtebkpyuacop.supabase.co wss://wjcstqqihtebkpyuacop.supabase.co https://api.anthropic.com https://api.resend.com https://api.stripe.com https://api.tavily.com https://api.apify.com https://cloudscenic.app.n8n.cloud https://hooks.slack.com https://accounts.google.com https://open.tiktokapis.com https://oauth2.googleapis.com https://www.googleapis.com; frame-ancestors 'self'; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self' https://www.instagram.com https://api.instagram.com https://www.tiktok.com https://open.tiktokapis.com https://accounts.google.com https://oauth2.googleapis.com"
